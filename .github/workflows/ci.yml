name: CI

# Lints, tests, and builds the shop/ app on every PR and on pushes to the
# default branch, so regressions are caught before they merge.

on:
  pull_request:
  push:
    branches:
      - claude/llm-council-skill-dhglrl

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shop/package-lock.json

      - name: Install deps
        working-directory: shop
        run: npm ci

      - name: Lint
        working-directory: shop
        run: npm run lint

      - name: Test
        working-directory: shop
        run: npm run test

      - name: Build
        working-directory: shop
        run: npm run build
